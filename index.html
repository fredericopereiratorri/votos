<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapas Eleitorais - Eugênia Lima</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="map"></div>

    <!-- Toggle entre mapas -->
    <div class="map-toggle">
        <button id="btnOlinda" class="active">Mapa Municipal (Olinda)</button>
        <button id="btnPernambuco">Mapa Estadual (PE)</button>
    </div>

    <!-- Painel de informações -->
    <div class="info-panel">
        <h2 id="infoPanelToggle"><span id="mapTitle">Mapa de Calor - Olinda</span></h2>
        <div class="panel-content" id="infoPanelContent">
            <p style="color: #666; font-size: 13px;" id="mapSubtitle">Votos de Eugênia Lima por bairro</p>

            <div class="slider-control">
                <label>Selecione os Anos:</label>
                <div id="yearCheckboxes" style="margin: 10px 0;"></div>
                <p style="color: #888; font-size: 11px; margin-top: 5px;">Média dos anos selecionados</p>
            </div>

            <div class="slider-control">
                <label for="intensitySlider">Intensidade do Mapa de Calor:</label>
                <input type="range" id="intensitySlider" min="0" max="100" value="70">
                <div class="value-display"><span id="intensityValue">70</span>%</div>
            </div>

            <div class="area-info" id="areaInfo" style="display: none;">
                <h3 id="areaNome"></h3>
                <p><strong>Média de votos:</strong> <span id="areaValor"></span></p>
                <p style="font-size: 12px; color: #888;"><span id="anosInfo"></span></p>
            </div>
        </div>
    </div>

    <!-- Legenda -->
    <div class="legend">
        <h4 id="legendToggle">Legenda de Votos</h4>
        <div class="legend-content" id="legendContent">
            <div class="legend-item"><div class="legend-color" style="background: #800026;"></div><span id="legend-very-high">Muito Alto (>800)</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #BD0026;"></div><span id="legend-high">Alto (500-800)</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #E31A1C;"></div><span id="legend-medium-high">Médio-Alto (300-500)</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #FC4E2A;"></div><span id="legend-medium">Médio (150-300)</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #FD8D3C;"></div><span id="legend-medium-low">Médio-Baixo (50-150)</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #FEB24C;"></div><span id="legend-low">Baixo (10-50)</span></div>
            <div class="legend-item"><div class="legend-color" style="background: #FED976;"></div><span id="legend-very-low">Muito Baixo (0-10)</span></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="dados_eleitorais_olinda.js"></script>
    <script src="dados_eleitorais_pe.js"></script>
    <script src="mapa.js"></script>
    
</body>
</html>
